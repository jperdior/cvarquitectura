<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio · Edificio interactivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <!-- Espacio de scroll: la posición del scroll es la "línea de tiempo" del recorrido -->
  <div id="scroll-space"></div>

  <header class="hud">
    <div class="brand">
      <strong id="arch-name"></strong>
      <span id="arch-role"></span>    </div>
    <div class="current" id="current-label"></div>
  </header>

  <section id="intro">
    <p class="kicker">Portfolio</p>
    <h1>Un edificio que se construye<br />mientras lo recorres</h1>
    <p class="hint">Haz scroll hacia arriba para entrar y empezar la obra ↑</p>
  </section>

  <nav id="progress" aria-label="Proyectos">
    <div class="track"><div class="fill"></div></div>
    <ol id="ticks"></ol>
  </nav>

  <!-- Detalles "AutoCAD": icono SCP y lector de coordenadas de la cámara -->
  <div id="cad-status">
    <svg class="ucs" viewBox="0 0 60 60" aria-hidden="true">
      <path d="M10 50 H50" stroke="#e5484d" stroke-width="2" />
      <path d="M10 50 V10" stroke="#46a758" stroke-width="2" />
      <rect x="7" y="47" width="6" height="6" fill="none" stroke="#c9d1d9" stroke-width="1.2" />
      <text x="52" y="54">X</text><text x="6" y="8">Y</text>
    </svg>
    <span id="coords">0.0000, 0.0000, 0.0000</span>
    <span class="cmd">Comando: _3DPASEO</span>
  </div>

  <aside id="panel" aria-hidden="true">
    <button class="sheet-handle" aria-label="Ampliar ficha"></button>
    <button class="close" aria-label="Cerrar">×</button>
    <p class="meta" id="p-meta"></p>
    <h2 id="p-title"></h2>
    <dl>
      <dt>Ubicación</dt><dd id="p-location"></dd>
      <dt>Tipología</dt><dd id="p-type"></dd>
      <dt>Superficie</dt><dd id="p-surface"></dd>
    </dl>
    <p id="p-desc"></p>
  </aside>

  <script type="module" src="main.js"></script>
</body>
</html>
